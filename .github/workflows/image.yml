name: Container image
on:
  push:
    branches: [main, codex/silicon-deploy]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/afreecoder/jinzhang:sha-${{ github.sha }}
          # 门户安装入口取自仓库的 Actions 变量，未设置时为空，首页显示「即将提供」。
          build-args: |
            REVISION=${{ github.sha }}
            JINZHANG_OBSIDIAN_REPO=${{ vars.JINZHANG_OBSIDIAN_REPO }}
            JINZHANG_SKILL_INSTALL=${{ vars.JINZHANG_SKILL_INSTALL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
