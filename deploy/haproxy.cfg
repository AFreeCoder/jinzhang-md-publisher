global
    log stdout format raw local0
    maxconn 256
    stats socket /tmp/admin.sock mode 600 level admin

defaults
    mode http
    log global
    timeout connect 5s
    timeout client 30s
    timeout server 60s
    timeout queue 5s
    timeout http-request 10s
    option forwardfor

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

frontend public
    bind :8080
    acl transit path_beg /api/transit/
    acl complete path -i /api/transit/complete
    # 此端口只通过宿主 Caddy 访问；Caddy 强制覆盖客户端 IP 头。
    http-request track-sc0 hdr_ip(X-Real-IP) table minute if transit
    http-request track-sc1 hdr_ip(X-Real-IP) table daily if transit
    http-request deny deny_status 429 if transit { sc_http_req_rate(0) gt 60 }
    http-request deny deny_status 429 if transit { sc_http_req_rate(1) gt 1000 }
    use_backend decode if complete
    default_backend app

backend minute
    stick-table type ip size 100k expire 2m store http_req_rate(60s)
backend daily
    stick-table type ip size 100k expire 48h store http_req_rate(24h)
backend app
    server web web:3000 check resolvers docker init-addr libc,none
backend decode
    # 强制每条后端连接只承载一个请求，最多同时完整解码两张图片。
    option http-server-close
    server web web:3000 check resolvers docker init-addr libc,none maxconn 2 maxqueue 8
